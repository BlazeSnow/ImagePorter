name: Publish ImagePorter Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        default: 'v0.0.0.0'
      beta:
        description: 'Publish beta image tag'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  CRANE_VERSION: v0.21.5
  SUPERCRONIC_VERSION: v0.2.45

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: imageporter
        password: ${{ secrets.DockerHub_TOKEN }}

    - name: Login to GitHub
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Download tools
      shell: bash
      run: |
        set -euo pipefail

        for arch in amd64 arm64; do
          case "${arch}" in
            amd64) crane_arch="x86_64" ;;
            arm64) crane_arch="arm64" ;;
          esac

          target_dir="${PWD}/bin/linux_${arch}"
          mkdir -p "${target_dir}"

          curl -fsSL \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_${crane_arch}.tar.gz" \
            -o go-containerregistry.tar.gz
          tar -xzf go-containerregistry.tar.gz -C "${target_dir}" crane
          rm -f go-containerregistry.tar.gz

          curl -fsSL \
            "https://github.com/aptible/supercronic/releases/download/${SUPERCRONIC_VERSION}/supercronic-linux-${arch}" \
            -o "${target_dir}/supercronic"

          chmod +x "${target_dir}/crane" "${target_dir}/supercronic"
        done

    - name: Generate image tags
      id: image-tags
      shell: bash
      run: |
        set -euo pipefail

        {
          echo "tags<<EOF"
          echo "imageporter/imageporter:${{ inputs.tag }}"
          echo "ghcr.io/imageporter/imageporter:${{ inputs.tag }}"
          if [ "${{ inputs.beta }}" = "true" ]; then
            echo "imageporter/imageporter:beta"
            echo "ghcr.io/imageporter/imageporter:beta"
          else
            echo "imageporter/imageporter:latest"
            echo "ghcr.io/imageporter/imageporter:latest"
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.image-tags.outputs.tags }}

    - uses: ncipollo/release-action@v1
      with:
        tag: ${{ inputs.tag }}
