name: Publish ImagePorter Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        default: 'v0.0.0.0'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: imageporter
        password: ${{ secrets.DockerHub_TOKEN }}

    - name: Login to GitHub
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: stable
        cache: false

    - name: Build tools
      shell: bash
      run: |
        set -euo pipefail

        export GOPATH="${PWD}/.gopath"
        host_platform="$(go env GOHOSTOS)_$(go env GOHOSTARCH)"

        for arch in amd64 arm64; do
          export GOOS=linux
          export GOARCH="${arch}"
          unset GOBIN

          go install github.com/google/go-containerregistry/cmd/crane@v0.21.5
          go install github.com/aptible/supercronic@v0.2.45

          install_dir="${GOPATH}/bin"
          if [ "${GOOS}_${GOARCH}" != "${host_platform}" ]; then
            install_dir="${install_dir}/${GOOS}_${GOARCH}"
          fi

          target_dir="${PWD}/bin/${GOOS}_${GOARCH}"
          mkdir -p "${target_dir}"
          cp "${install_dir}/crane" "${target_dir}/crane"
          cp "${install_dir}/supercronic" "${target_dir}/supercronic"
          chmod +x "${target_dir}/crane" "${target_dir}/supercronic"
        done

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: |
          imageporter/imageporter:${{ inputs.tag }}
          imageporter/imageporter:latest
          ghcr.io/imageporter/imageporter:${{ inputs.tag }}
          ghcr.io/imageporter/imageporter:latest

    - uses: ncipollo/release-action@v1
      with:
        tag: ${{ inputs.tag }}
